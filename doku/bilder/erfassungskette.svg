<text x="32" y="343" font-size="11.5" fill="#43505e">Bürgerinitiative</text>
<text x="32" y="359" font-size="11.5" fill="#43505e">100-m-Raster, Entfernungsfeld</text>
<rect x="300" y="90" width="215" height="110" rx="7" fill="#6a1b9a" fill-opacity="0.09" stroke="#6a1b9a" stroke-width="1.6"/>
<text x="312" y="111" font-size="13.5" font-weight="700" fill="#6a1b9a">4. Luftfahrzeuggruppe</text>
<text x="312" y="131" font-size="11.5" fill="#43505e">DIN 45684-1: P 1.0 bis S</text>
<text x="312" y="147" font-size="11.5" fill="#43505e">Antrieb und Startmasse</text>
<text x="312" y="163" font-size="11.5" fill="#43505e">unbekanntes Muster wird</text>
<text x="312" y="179" font-size="11.5" fill="#43505e">getrennt ausgewiesen</text>
<rect x="300" y="230" width="215" height="110" rx="7" fill="#00838f" fill-opacity="0.09" stroke="#00838f" stroke-width="1.6"/>
<text x="312" y="251" font-size="13.5" font-weight="700" fill="#00838f">5. Pegelabschätzung</text>
<text x="312" y="271" font-size="11.5" fill="#43505e">Bezugspegel in 300 m</text>
<text x="312" y="287" font-size="11.5" fill="#43505e">Abstandsmaß und Luftdämpfung</text>
<text x="312" y="303" font-size="11.5" fill="#43505e">über die Schrägentfernung</text>
<text x="312" y="319" font-size="11.5" fill="#43505e">Platzrunde: Zusatzpegel</text>
<rect x="580" y="160" width="215" height="110" rx="7" fill="#c2185b" fill-opacity="0.09" stroke="#c2185b" stroke-width="1.6"/>
<text x="592" y="181" font-size="13.5" font-weight="700" fill="#c2185b">6. Ergebnis</text>
<text x="592" y="201" font-size="11.5" fill="#43505e">Ereignisse ab 55 dB(A)</text>
<text x="592" y="217" font-size="11.5" fill="#43505e">Ereignisse ab 65 dB(A)</text>
<text x="592" y="233" font-size="11.5" fill="#43505e">je Ortslage und Gruppe</text>
<text x="592" y="249" font-size="11.5" fill="#43505e">Karte, Tabelle, CSV</text>
