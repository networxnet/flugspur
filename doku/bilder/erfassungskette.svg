<text x="32" y="191" font-size="11.5" fill="#43505e">ADS-B-Feld r und desc</text>
<text x="32" y="207" font-size="11.5" fill="#43505e">OGN Device Database</text>
<text x="32" y="223" font-size="11.5" fill="#43505e">sonst nur Hexcode</text>
<rect x="20" y="270" width="215" height="110" rx="7" fill="#ef6c00" fill-opacity="0.09" stroke="#ef6c00" stroke-width="1.6"/>
<text x="32" y="291" font-size="13.5" font-weight="700" fill="#ef6c00">3. Ortslagen</text>
