<rect x="20" y="30" width="215" height="96" rx="7" fill="#1565c0" fill-opacity="0.09" stroke="#1565c0" stroke-width="1.6"/>
<text x="32" y="51" font-size="13.5" font-weight="700" fill="#1565c0">1. Positionen</text>
<text x="32" y="71" font-size="11.5" fill="#43505e">adsb.fi und adsb.lol (ADS-B)</text>
