# ---------------------------------------------------------------------------
#  Flugspur-Mitschnitt EDLN  --  QNAP / QTS mit Portainer
#  Kein Image-Build, kein SSH, kein pip. Reine Standardbibliothek.
#
#  Voraussetzung: auf dem NAS existiert
#     /share/CACHEDEV1_DATA/Container/flugspur/repo/        <- Git-Arbeitskopie
#     /share/CACHEDEV1_DATA/Container/flugspur/data/        <- Mitschnitte
#     /share/CACHEDEV1_DATA/Container/flugspur/data    <- leer, hier entstehen die Daten
#
#  Stimmt der Pfad nicht, zuerst den Pfadtest aus INSTALLATION_QNAP.md laufen
#  lassen. Ein falscher Pfad fuehrt dazu, dass die Container mit
#  "can't open file '/app/adsb_logger.py'" im Neustart haengen.
# ---------------------------------------------------------------------------
services:

  adsb:
    image: python:3.12-slim
    container_name: ${STACK:-flugspur}-adsb
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "/app/adsb_logger.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Berlin"
      TRACKER_PLATZ: "edln"       # Profil aus app/plaetze/<name>.json
      TRACKER_RADIUS_NM: "15"
      TRACKER_MAX_ALT_FT: "10000"
      TRACKER_INTERVAL_S: "5"
      TRACKER_DATA_DIR: "/data"
    volumes:
      - ${FS_APP_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/repo/app}:/app:ro
      - ${FS_DATA_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/data}:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import time,sys;t=int(open('/data/_heartbeat_adsb.txt').readline());sys.exit(0 if time.time()-t<180 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  ogn:
    image: python:3.12-slim
    container_name: ${STACK:-flugspur}-ogn
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "/app/ogn_logger.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Berlin"
      TRACKER_PLATZ: "edln"       # Profil aus app/plaetze/<name>.json
      TRACKER_RADIUS_NM: "15"
      TRACKER_DATA_DIR: "/data"
    volumes:
      - ${FS_APP_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/repo/app}:/app:ro
      - ${FS_DATA_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/data}:/data

  summary:
    image: python:3.12-slim
    container_name: ${STACK:-flugspur}-summary
    restart: unless-stopped
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Berlin"
      TRACKER_PLATZ: "edln"
      TRACKER_DATA_DIR: "/data"
      TRACKER_OVERFLIGHT_KM: "1.0"
      TRACKER_LOW_FT: "2500"
      TRACKER_VIEW_KM: "11"
    volumes:
      - ${FS_APP_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/repo/app}:/app:ro
      - ${FS_DATA_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/data}:/data

  # 4) Live-Monitor im Browser:  http://<NAS-Adresse>:8099
  monitor:
    image: python:3.12-slim-bookworm
    container_name: ${STACK:-flugspur}-monitor
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "/app/monitor.py"]
    ports:
      - "${FS_MONITOR_PORT:-8099}:${FS_MONITOR_PORT:-8099}"
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Berlin"
      TRACKER_PLATZ: "edln"
      TRACKER_DATA_DIR: "/data"
      TRACKER_MONITOR_PORT: "${FS_MONITOR_PORT:-8099}"
    volumes:
      - ${FS_APP_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/repo/app}:/app:ro
      - ${FS_DATA_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/data}:/data:ro

  # ---------------------------------------------------------------------
  # Holt neue Staende aus dem Repository. Die uebrigen Dienste merken die
  # Aenderung selbst und beenden sich; Docker startet sie mit dem neuen
  # Code neu (siehe app/neustart.py). Damit ist ein Update ein Commit,
  # mehr nicht.
  #
  # Abschalten: FS_UPDATE_S auf 0 setzen.
  # ---------------------------------------------------------------------
  aktualisierer:
    image: alpine/git:latest
    container_name: ${STACK:-flugspur}-aktualisierer
    restart: unless-stopped
    environment:
      - FS_UPDATE_S=${FS_UPDATE_S:-900}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        git config --global --add safe.directory /repo
        if [ "$${FS_UPDATE_S}" = "0" ]; then
          echo "[update] abgeschaltet (FS_UPDATE_S=0)"; sleep infinity
        fi
        echo "[update] aktiv, alle $${FS_UPDATE_S} s"
        while true; do
          vorher=$$(git -C /repo rev-parse HEAD 2>/dev/null)
          git -C /repo pull --ff-only 2>&1 | sed 's/^/[update] /'
          nachher=$$(git -C /repo rev-parse HEAD 2>/dev/null)
          if [ "$$vorher" != "$$nachher" ]; then
            echo "[update] neuer Stand: $$nachher"
            git -C /repo log -1 --format='[update] %s' 2>/dev/null
          fi
          sleep "$${FS_UPDATE_S}"
        done
    volumes:
      - ${FS_REPO_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/repo}:/repo
