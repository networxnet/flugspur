# ---------------------------------------------------------------------------
#  GESCHLOSSENER STACK  --  Code steckt im Image, nichts liegt auf dem Host.
#
#  Plattformunabhaengig: laeuft identisch auf QNAP, Synology, Unraid, Debian
#  und Raspberry Pi (das Image ist amd64 + arm64).
#
#  Beide Werte haben eine Vorgabe und koennen in Portainer unter
#  "Environment variables" ueberschrieben werden:
#     FS_IMAGE        z. B. ghcr.io/networxnet/flugspur:1.0
#     FS_PROFIL_PFAD  optional: Ordner mit abweichenden Profildateien.
#                     Was dort liegt, hat Vorrang vor dem Abbild --
#                     edln.json, zonen_edln.json, grundkarte_edln.json.
#                     Darf leer oder nicht vorhanden sein.
#     FS_DATA_PFAD  z. B. /share/CACHEDEV1_DATA/Container/flugspur/data   (QNAP)
#                          /mnt/daten/edln/data                  (Raspberry Pi)
#
#  Umzug auf eine andere Plattform = nur FS_DATA_PFAD aendern.
# ---------------------------------------------------------------------------
services:

  adsb:
    image: ${FS_IMAGE:-ghcr.io/networxnet/flugspur:latest}
    # Abbild laeuft als Benutzer 1000. Scheitert das Schreiben nach
    # /data auf dem Share, FS_USER=0:0 setzen.
    user: "${FS_USER:-1000:1000}"
    container_name: ${STACK:-flugspur}-adsb
    restart: unless-stopped
    command: ["python3", "/app/adsb_logger.py"]
    environment:
      TZ: "Europe/Berlin"
      TRACKER_PLATZ: "edln"       # Profil aus app/plaetze/<name>.json
      TRACKER_RADIUS_NM: "15"
      TRACKER_MAX_ALT_FT: "10000"
      TRACKER_INTERVAL_S: "5"
      TRACKER_DATA_DIR: "/data"
      TRACKER_HEARTBEAT: "/data/_heartbeat_adsb.txt"
    volumes:
      - ${FS_DATA_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/data}:/data
      - ${FS_PROFIL_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/profil}:/profil:ro

  ogn:
    image: ${FS_IMAGE:-ghcr.io/networxnet/flugspur:latest}
    # Abbild laeuft als Benutzer 1000. Scheitert das Schreiben nach
    # /data auf dem Share, FS_USER=0:0 setzen.
    user: "${FS_USER:-1000:1000}"
    container_name: ${STACK:-flugspur}-ogn
    restart: unless-stopped
    command: ["python3", "/app/ogn_logger.py"]
    environment:
      TZ: "Europe/Berlin"
      TRACKER_PLATZ: "edln"       # Profil aus app/plaetze/<name>.json
      TRACKER_RADIUS_NM: "15"
      TRACKER_DATA_DIR: "/data"
      TRACKER_HEARTBEAT: "/data/_heartbeat_ogn.txt"
    volumes:
      - ${FS_DATA_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/data}:/data
      - ${FS_PROFIL_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/profil}:/profil:ro

  summary:
    image: ${FS_IMAGE:-ghcr.io/networxnet/flugspur:latest}
    # Abbild laeuft als Benutzer 1000. Scheitert das Schreiben nach
    # /data auf dem Share, FS_USER=0:0 setzen.
    user: "${FS_USER:-1000:1000}"
    container_name: ${STACK:-flugspur}-summary
    restart: unless-stopped
    command: ["sleep", "infinity"]
    healthcheck:
      disable: true
    environment:
      TZ: "Europe/Berlin"
      TRACKER_PLATZ: "edln"
      TRACKER_DATA_DIR: "/data"
      TRACKER_OVERFLIGHT_KM: "1.0"
      TRACKER_LOW_FT: "2500"
      TRACKER_VIEW_KM: "11"
    volumes:
      - ${FS_DATA_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/data}:/data
      - ${FS_PROFIL_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/profil}:/profil:ro

  # 4) Live-Monitor im Browser:  http://<Adresse>:8099
  monitor:
    image: ${FS_IMAGE:-ghcr.io/networxnet/flugspur:latest}
    # Abbild laeuft als Benutzer 1000. Scheitert das Schreiben nach
    # /data auf dem Share, FS_USER=0:0 setzen.
    user: "${FS_USER:-1000:1000}"
    container_name: ${STACK:-flugspur}-monitor
    restart: unless-stopped
    command: ["python3", "/app/monitor.py"]
    ports:
      - "${FS_MONITOR_PORT:-8099}:${FS_MONITOR_PORT:-8099}"
    healthcheck:
      disable: true
    environment:
      TZ: "Europe/Berlin"
      TRACKER_PLATZ: "edln"
      TRACKER_DATA_DIR: "/data"
      TRACKER_MONITOR_PORT: "${FS_MONITOR_PORT:-8099}"
    volumes:
      - ${FS_DATA_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/data}:/data:ro
      - ${FS_PROFIL_PFAD:-/share/CACHEDEV1_DATA/Container/flugspur/profil}:/profil:ro
