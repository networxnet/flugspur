# Baut das Image fuer amd64 UND arm64 und legt es in die GitHub Container
# Registry (ghcr.io). Kostenlos, kein eigener Build-Rechner noetig.
#
# EINMALIG NOETIG, sonst scheitert der Lauf:
#   Settings -> Actions -> General -> Workflow permissions
#     -> "Read and write permissions" aktivieren -> Save
#
# Bei einem OEFFENTLICHEN Repository wird das Paket automatisch oeffentlich
# und laesst sich ohne Anmeldung ziehen -- am 11.10.2026 geprueft.
# Nur falls das Repository privat ist, muss die Sichtbarkeit von Hand
# gesetzt werden: Profil -> Packages -> flugspur -> Package settings
#   -> Change visibility -> Public
name: Image bauen und veroeffentlichen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:        # Start per Knopfdruck in der Weboberflaeche

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      # ghcr.io akzeptiert nur Kleinbuchstaben im Imagenamen. Benutzernamen
      # duerfen aber Grossbuchstaben enthalten -- deshalb hier umwandeln.
      - name: Imagenamen in Kleinbuchstaben bilden
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/flugspur" >> "$GITHUB_OUTPUT"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten und Tags ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Bauen und hochladen (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis anzeigen
        run: |
          echo "## Image fertig gebaut" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tragen Sie in Portainer als Variable FS_IMAGE ein:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.name.outputs.image }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Nicht vergessen: Packages -> flugspur -> Change visibility -> Public" >> $GITHUB_STEP_SUMMARY
