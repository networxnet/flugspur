# Flugspur -- NUR der Live-Monitor, als eigener Stack.
#
# Beruehrt die Aufzeichnung nicht: /app und /data werden NUR LESEND
# eingebunden. Laesst sich jederzeit gefahrlos loeschen und neu anlegen.
#
# In Portainer:  Stacks -> Add stack -> Name "flugspur-monitor"
#                -> Web editor -> diesen Text einfuegen -> Deploy
#
# NUR noetig, wenn der Hauptstack KEINEN Monitor enthaelt. Meldet Portainer
# "container name is already used", ist der Monitor bereits vorhanden --
# dann diesen Stack nicht anlegen, sondern den vorhandenen Container nutzen.
#
# Aufruf danach:  http://<Adresse-des-NAS>:8099     (http, nicht https)
#
# Ist Port 8099 belegt: NICHT die Zeilen anfassen, sondern beim Deploy
# unten unter "Environment variables" eintragen:
#     name = FS_MONITOR_PORT     value = 8077
# Damit werden Freigabe und Server gemeinsam umgestellt; sie koennen
# nicht mehr auseinanderlaufen. Aufruf dann http://<NAS>:8077

services:
  monitor:
    image: python:3.12-slim-bookworm
    container_name: flugspur-monitor2
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "/app/monitor.py"]
    ports:
      - "${FS_MONITOR_PORT:-8099}:${FS_MONITOR_PORT:-8099}"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: "Europe/Berlin"
      TRACKER_PLATZ: "edln"
      TRACKER_DATA_DIR: "/data"
      TRACKER_MONITOR_PORT: "${FS_MONITOR_PORT:-8099}"
    volumes:
      - /share/CACHEDEV1_DATA/Container/flugspur/repo/app:/app:ro
      - /share/CACHEDEV1_DATA/Container/flugspur/data:/data:ro
