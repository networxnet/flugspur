# ---------------------------------------------------------------------------
#  PFADTEST -- laeuft einmal, schreibt ins Log, beendet sich.
#  Zweck: Pfad, Schreibrechte und Internetzugang pruefen, BEVOR der
#  eigentliche Stack ausgerollt wird.
#
#  In Portainer unter "Environment variables" setzen:
#     FS_APP_PFAD   nur noetig bei der Bind-Mount-Variante,
#                     z. B. /share/Container/flugspur/app
#     FS_DATA_PFAD  z. B. /share/Container/flugspur/data
#
#  Danach: Containers -> Logs der beiden Container ansehen.
# ---------------------------------------------------------------------------
services:

  # Test 1: als root -- gilt fuer die Bind-Mount-Variante
  pfadtest-root:
    image: python:3.12-slim-bookworm
    container_name: ${STACK:-flugspur}-pfadtest-root
    restart: "no"
    volumes:
      - ${FS_APP_PFAD:-/tmp}:/app:ro
      - ${FS_DATA_PFAD:?FS_DATA_PFAD muss gesetzt werden}:/data
    command:
      - sh
      - -c
      - |
        echo "=================================================="
        echo " TEST ALS ROOT (Bind-Mount-Variante)"
        echo "=================================================="
        echo " Inhalt von /app :"
        if ls /app 2>/dev/null | grep -q "\.py"; then ls -la /app; else
          echo "   LEER ODER NICHT VORHANDEN"
          echo "   -> nur wichtig fuer die Bind-Mount-Variante,"
          echo "      beim geschlossenen Image egal."
        fi
        echo "--------------------------------------------------"
        echo " Schreibtest /data als root (uid 0):"
        if touch /data/_t_root 2>/dev/null; then echo "   OK"; rm -f /data/_t_root; else echo "   FEHLGESCHLAGEN"; fi
        echo "--------------------------------------------------"
        echo " Internetzugang:"
        python3 -c "import urllib.request as u;print('   adsb.fi erreichbar, HTTP',u.urlopen('https://opendata.adsb.fi/api/v2/lat/51.23/lon/6.50/dist/15',timeout=15).status)" 2>/dev/null || echo "   KEIN Internetzugang"
        echo "--------------------------------------------------"
        echo " OGN-Netz erreichbar:"
        python3 -c "import socket;s=socket.create_connection(('aprs.glidernet.org',14580),timeout=15);print('   OGN-Server erreichbar');s.close()" 2>/dev/null || echo "   OGN-Server NICHT erreichbar (Port 14580 geblockt?)"
        echo "=================================================="

  # Test 2: als uid 1000 -- DAS ist der entscheidende Test fuer das
  # geschlossene Image, denn darin laeuft der Prozess unprivilegiert.
  pfadtest-uid1000:
    image: python:3.12-slim-bookworm
    container_name: ${STACK:-flugspur}-pfadtest-uid1000
    restart: "no"
    user: "1000:1000"
    volumes:
      - ${FS_DATA_PFAD:?FS_DATA_PFAD muss gesetzt werden}:/data
    command:
      - sh
      - -c
      - |
        echo "=================================================="
        echo " TEST ALS UID 1000 (geschlossenes Image)"
        echo "=================================================="
        id
        echo " Schreibtest /data als uid 1000:"
        if touch /data/_t_1000 2>/dev/null; then
          echo "   OK -- geschlossenes Image kann schreiben"
          rm -f /data/_t_1000
        else
          echo "   FEHLGESCHLAGEN"
          echo "   -> Ordner gehoert einem anderen Benutzer."
          echo "      Abhilfe A: in der Compose-Datei  user: \"0:0\"  ergaenzen"
          echo "      Abhilfe B: Schreibrecht fuer alle setzen (File Station)"
        fi
        echo "=================================================="
