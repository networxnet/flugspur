# ---------------------------------------------------------------------------
#  PFADTEST  --  QNAP, ohne jede Variable
#
#  Laeuft einmal, schreibt das Ergebnis ins Log, beendet sich.
#  Prueft: Pfad richtig? Schreibrecht? Internet? OGN-Port offen?
#
#  Einfach einfuegen und deployen. NICHTS auszufuellen.
#  Stimmt Ihr Pfad nicht, nur die drei mit <<< markierten Zeilen aendern.
#
#  Danach: Containers -> Logs von flugspur-pfadtest-uid1000 ansehen.
# ---------------------------------------------------------------------------
services:

  # Test 1: als root -- gilt fuer die Bind-Mount-Variante (Testphase)
  pfadtest-root:
    image: python:3.12-slim-bookworm
    container_name: flugspur-pfadtest-root
    restart: "no"
    volumes:
      - /share/CACHEDEV1_DATA/Container/flugspur/repo/app:/app:ro      # <<< Pfad ggf. anpassen
      - /share/CACHEDEV1_DATA/Container/flugspur/data:/data       # <<< Pfad ggf. anpassen
    command:
      - sh
      - -c
      - |
        echo "=================================================="
        echo " TEST ALS ROOT (Bind-Mount-Variante)"
        echo "=================================================="
        echo " Inhalt von /app :"
        if ls /app 2>/dev/null | grep -q "\.py"; then
          ls -la /app
          echo " --- Profile in /app/plaetze :"
          ls /app/plaetze 2>/dev/null || echo "   FEHLT -- Ordner plaetze/ nicht mit hochgeladen!"
        else
          echo "   LEER ODER NICHT VORHANDEN -> Pfad stimmt nicht"
        fi
        echo "--------------------------------------------------"
        echo " Schreibtest /data als root (uid 0):"
        if touch /data/_t_root 2>/dev/null; then echo "   OK"; rm -f /data/_t_root; else echo "   FEHLGESCHLAGEN"; fi
        echo "--------------------------------------------------"
        echo " Internetzugang:"
        python3 -c "import urllib.request as u;print('   adsb.fi erreichbar, HTTP',u.urlopen(u.Request('https://opendata.adsb.fi/api/v2/lat/51.23/lon/6.50/dist/15',headers={'User-Agent':'Flugspur/1.0'}),timeout=20).status)" || echo "   ^^^ obiger Fehler ist die Ursache -- Diagnose-Stack ausfuehren"
        echo "--------------------------------------------------"
        echo " OGN-Netz (Port 14580):"
        python3 -c "import socket;s=socket.create_connection(('aprs.glidernet.org',14580),timeout=15);print('   erreichbar');s.close()" || echo "   ^^^ Firewall blockt ausgehend 14580?"
        echo "=================================================="

  # Test 2: als uid 1000 -- entscheidend fuer das spaetere Image
  pfadtest-uid1000:
    image: python:3.12-slim-bookworm
    container_name: flugspur-pfadtest-uid1000
    restart: "no"
    user: "1000:1000"
    volumes:
      - /share/CACHEDEV1_DATA/Container/flugspur/data:/data       # <<< Pfad ggf. anpassen
    command:
      - sh
      - -c
      - |
        echo "=================================================="
        echo " TEST ALS UID 1000 (spaeteres geschlossenes Image)"
        echo "=================================================="
        id
        echo " Schreibtest /data als uid 1000:"
        if touch /data/_t_1000 2>/dev/null; then
          echo "   OK -- auch das geschlossene Image kann schreiben"
          rm -f /data/_t_1000
        else
          echo "   FEHLGESCHLAGEN"
          echo "   Fuer die Testphase (Bind-Mount) unkritisch."
          echo "   Vor dem Umstieg aufs Image beheben:"
          echo "     A: in der Compose-Datei  user: \"0:0\"  ergaenzen"
          echo "     B: Schreibrecht fuer alle auf data/ setzen"
        fi
        echo "=================================================="
